name: Accessibility

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/public/accessibility.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/accessibility.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'tests/public/accessibility.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/accessibility.yml'
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-pages:
    name: Public WCAG A/AA smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run public accessibility smoke
        run: npm run test:e2e:accessibility
